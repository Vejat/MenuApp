services:
  - type: web
    name: menuapp-piloto
    runtime: docker
    plan: free
    region: ohio
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: menuapp-piloto-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: STAFF_PASSWORD
        generateValue: true
databases:
  - name: menuapp-piloto-db
    region: ohio
    plan: free
    ipAllowList: []
