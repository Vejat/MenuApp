services:
  - type: web
    name: menuapp-piloto
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    numInstances: 1
    healthCheckPath: /healthz
    preDeployCommand: node migrate.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: menuapp-piloto-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
databases:
  - name: menuapp-piloto-db
    region: ohio
    plan: 0.1c-256mb
    ipAllowList: []
