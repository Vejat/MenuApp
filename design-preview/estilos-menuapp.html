<div id="menuapp-preview">
  <div class="viz-row ma-steps" aria-label="Pantalla de la prueba">
    <button class="btn" type="button" data-screen="menu" aria-pressed="true">Carta</button>
    <button class="btn" type="button" data-screen="cart" aria-pressed="false">Carrito</button>
    <button class="btn" type="button" data-screen="orders" aria-pressed="false">Pedidos</button>
    <button class="btn" type="button" data-screen="bill" aria-pressed="false">Cuenta</button>
  </div>
  <div class="ma-gallery" aria-label="Propuestas visuales de MenuApp">
    <section data-variant="Bistró editorial"><h3>Bistró editorial</h3><div class="ma-app editorial" aria-label="Bistró editorial"></div></section>
    <section data-variant="Mercado vibrante"><h3>Mercado vibrante</h3><div class="ma-app market" aria-label="Mercado vibrante"></div></section>
    <section data-variant="Servicio minimal"><h3>Servicio minimal</h3><div class="ma-app minimal" aria-label="Servicio minimal"></div></section>
    <section data-variant="Carta nocturna"><h3>Carta nocturna</h3><div class="ma-app night" aria-label="Carta nocturna"></div></section>
  </div>
</div>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap');
  #menuapp-preview .ma-steps { margin-bottom: 12px; }
  #menuapp-preview .ma-gallery { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; }
  #menuapp-preview [data-variant] { display: grid; align-content: start; justify-items: center; gap: 8px; min-width: 0; }
  @media (max-width: 620px) { #menuapp-preview .ma-gallery { grid-template-columns: minmax(0,1fr); } }
  #menuapp-preview .ma-app {
    color-scheme: light dark;
    box-sizing: border-box;
    display: flex; flex-direction: column;
    width: min(100%, 360px); min-height: 485px; margin: auto;
    border-radius: var(--radius, 20px); overflow: hidden;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); font: 500 14px/1.4 "DM Sans", system-ui, sans-serif;
    box-shadow: 0 12px 32px rgb(0 0 0 / .14);
  }
  #menuapp-preview .editorial {
    --surface: light-dark(#fff7eb,#221b17); --ink: light-dark(#352019,#fff2e1);
    --muted: light-dark(#71584c,#d3b7a8); --line: light-dark(#e5d3c2,#4b3931);
    --accent: light-dark(#792f34,#f2a7a7); --on-accent: light-dark(#fff8ee,#401818);
    --soft: light-dark(#f2e4d8,#392a25); --display: "Instrument Serif", Georgia, serif;
  }
  #menuapp-preview .market {
    --surface: light-dark(#fff8e9,#231b12); --ink: light-dark(#33220e,#fff3db);
    --muted: light-dark(#6b4e29,#dabd91); --line: light-dark(#e8d2a5,#503d23);
    --accent: light-dark(#9c341a,#ffb28f); --on-accent: light-dark(#fff8e9,#3d1b10);
    --soft: light-dark(#f9df92,#463518); --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  #menuapp-preview .minimal {
    --surface: light-dark(#f4faf8,#14211e); --ink: light-dark(#142e2a,#edf9f5);
    --muted: light-dark(#46645d,#b0c9c2); --line: light-dark(#cddfd8,#34504a);
    --accent: light-dark(#155551,#8be0d1); --on-accent: light-dark(#fff,#102f2c);
    --soft: light-dark(#e1efea,#223c36); --display: "DM Sans", system-ui, sans-serif;
  }
  #menuapp-preview .ma-app.night {
    --surface: #171620; --ink: #f9f6ff; --muted: #d0c8df; --line: #40384f;
    --accent: #dafa78; --on-accent: #212415; --soft: #2b2537;
    --display: "DM Sans", system-ui, sans-serif;
    color-scheme: dark;
  }
  #menuapp-preview .ma-app * { box-sizing: border-box; }
  #menuapp-preview .ma-header, #menuapp-preview .ma-foot, #menuapp-preview .ma-nav {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px;
  }
  #menuapp-preview .ma-header { border-bottom: 1px solid var(--line); }
  #menuapp-preview .ma-mesa { color: var(--muted); white-space: nowrap; }
  #menuapp-preview .ma-help { margin-left: auto; }
  #menuapp-preview .ma-app button, #menuapp-preview .ma-app select {
    font: inherit; color: inherit; background: var(--soft); border: 1px solid transparent;
    border-radius: 9px; padding: 7px 10px; min-height: 42px;
  }
  #menuapp-preview .ma-app button:focus-visible, #menuapp-preview .ma-app select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #menuapp-preview .ma-app button:disabled { opacity: .55; }
  #menuapp-preview .ma-app .ma-primary { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  #menuapp-preview .ma-app .ma-quiet { background: transparent; color: var(--accent); }
  #menuapp-preview .ma-body { flex: 1; padding: 13px 16px; }
  #menuapp-preview .ma-app h2 { margin: 0; font: 600 30px/1.05 var(--display); color: var(--ink); }
  #menuapp-preview .editorial h2 { font-weight: 400; font-size: 39px; }
  #menuapp-preview .editorial .ma-body h2, #menuapp-preview .editorial .ma-lead { text-align: center; }
  #menuapp-preview .editorial .ma-body h2::after { content: ''; display: block; width: 34px; margin: 8px auto 0; border-top: 1px solid var(--accent); }
  #menuapp-preview .editorial .ma-row { padding-block: 9px; }
  #menuapp-preview .ma-app p { margin: 0; }
  #menuapp-preview .ma-lead { color: var(--muted); margin-top: 5px; }
  #menuapp-preview .ma-list { display: grid; gap: 0; margin-top: 12px; }
  #menuapp-preview .ma-row {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center;
    border-bottom: 1px solid var(--line); padding: 8px 0;
  }
  #menuapp-preview .ma-row strong { display: block; font-size: 15px; }
  #menuapp-preview .editorial .ma-row strong { font: 400 21px/1.1 var(--display); }
  #menuapp-preview .ma-price { display: block; color: var(--accent); font-variant-numeric: tabular-nums; }
  #menuapp-preview .ma-desc { color: var(--muted); display: block; }
  #menuapp-preview .ma-adjust { display: flex; align-items: center; gap: 5px; }
  #menuapp-preview .ma-adjust button { min-width: 42px; }
  #menuapp-preview .ma-foot { border-top: 1px solid var(--line); }
  #menuapp-preview .ma-foot .ma-primary { margin-left: auto; }
  #menuapp-preview .ma-nav { justify-content: center; border-top: 1px solid var(--line); padding-block: 4px; }
  #menuapp-preview .ma-nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
  #menuapp-preview .market .ma-header { background: var(--soft); border: 0; }
  #menuapp-preview .market h2 { text-transform: uppercase; letter-spacing: .03em; }
  #menuapp-preview .market .ma-row { padding: 8px; background: var(--soft); border: 0; border-radius: 10px; }
  #menuapp-preview .market .ma-list { gap: 7px; }
  #menuapp-preview .market .ma-row button { border-color: var(--line); background: var(--surface); }
  #menuapp-preview .market .ma-foot .ma-primary { width: 100%; }
  #menuapp-preview .minimal .ma-body { padding-top: 20px; }
  #menuapp-preview .minimal .ma-row { grid-template-columns: minmax(0,1fr) auto; }
  #menuapp-preview .minimal .ma-row > div:first-child { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  #menuapp-preview .minimal .ma-desc { display: none; }
  #menuapp-preview .minimal .ma-nav { justify-content: space-evenly; }
  #menuapp-preview .night .ma-body:has(.ma-menu) .ma-list { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
  #menuapp-preview .night .ma-body:has(.ma-menu) .ma-row {
    background: var(--soft); border: 1px solid var(--line); border-radius: 13px;
    grid-template-columns: minmax(0,1fr); align-content: space-between; padding: 8px;
  }
  #menuapp-preview .night .ma-body:has(.ma-menu) .ma-row:first-child {
    grid-column: 1 / -1; grid-template-columns: minmax(0,1fr) auto; align-items: center;
    background: #3b2e50;
  }
  #menuapp-preview .night .ma-row button { background: var(--accent); color: var(--on-accent); }
  #menuapp-preview .night .ma-desc { display: none; }
  #menuapp-preview .ma-info { padding: 9px 11px; margin-top: 12px; border-radius: 8px; background: var(--soft); }
  #menuapp-preview .ma-method { display: grid; gap: 5px; margin-top: 12px; }
  #menuapp-preview .ma-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #menuapp-preview .ma-app .ma-nav button { padding-inline: 7px; }
</style>
<script>
(() => {
  const root = document.getElementById('menuapp-preview');
  const steps = [...root.querySelectorAll('[data-screen]')];
  const previews = [...root.querySelectorAll('.ma-app')];
  const menu = [
    { name: 'Churrasco italiano', note: 'Palta, tomate y mayo', price: 8900 },
    { name: 'Ensalada de estación', note: 'Hojas verdes y vinagreta', price: 6900 },
    { name: 'Limonada de menta', note: 'Limón fresco y menta', price: 3200 },
  ];
  const peso = value => '$' + new Intl.NumberFormat('es-CL').format(value);
  const names = { menu: 'Carta', cart: 'Carrito', orders: 'Pedidos', bill: 'Cuenta' };
  let current = 'menu';
  let previous = 'menu';
  let quantities = [1, 0, 0];
  let ordered = [0, 0, 0];
  let called = false;
  let method = '';
  let requested = false;
  const amount = quantities => menu.reduce((sum, item, index) => sum + item.price * quantities[index], 0);
  const button = (action, text, kind = 'ma-quiet', disabled = false) =>
    '<button type="button" class="' + kind + ' cursor-interaction" data-act="' + action + '"' + (disabled ? ' disabled' : '') + '>' + text + '</button>';
  const nav = (dense) => {
    const routes = dense ? ['menu', 'cart', 'orders', 'bill'] : ['menu', 'orders', 'bill'];
    return '<nav class="ma-nav" aria-label="Navegación de mesa">' + routes.map(id =>
      button(id, names[id]).replace('data-act', (current === id ? 'aria-current="page" ' : '') + 'data-act')
    ).join('') + '</nav>';
  };
  const list = (counts, isCart = false, isReadOnly = false) => '<div class="ma-list">' + menu.map((item, index) => {
    const count = counts[index];
    if ((isCart || isReadOnly) && !count) return '';
    const name = isReadOnly ? count + ' × ' + item.name : item.name;
    return '<div class="ma-row"><div><strong>' + name + '</strong>' +
      (!isCart && !isReadOnly ? '<span class="ma-desc">' + item.note + '</span>' : '') +
      '<span class="ma-price">' + peso(item.price * ((isCart || isReadOnly) ? count : 1)) + '</span></div>' +
      (isReadOnly ? '' : '<div class="ma-adjust">' +
        (isCart ? button('minus-' + index, '−').replace('data-act', 'aria-label="Quitar ' + item.name + '" data-act') + '<span>' + count + '</span>' : '') +
        button('plus-' + index, '+').replace('data-act', 'aria-label="Agregar ' + item.name + '" data-act') + '</div>') + '</div>';
  }).join('') + '</div>';
  const body = () => {
    if (current === 'menu') return '<h2 class="ma-menu">Carta</h2><div class="ma-lead">Platos y bebidas</div>' + list(quantities);
    if (current === 'cart') return '<h2>Revisa tu pedido</h2>' +
      (amount(quantities) ? list(quantities, true) : '<div class="ma-info">El carrito está vacío.</div>');
    if (current === 'orders') return '<h2>Tus pedidos</h2>' +
      (amount(ordered) ? '<div class="ma-info">Pedido recibido</div>' + list(ordered, false, true) :
        '<div class="ma-info">Cuando confirmes el carrito, podrás seguir el pedido aquí.</div>');
    if (current === 'bill') return '<h2>Tu cuenta</h2>' +
      (amount(ordered) ? list(ordered, false, true) +
        '<div class="ma-info">Total · <strong>' + peso(amount(ordered)) + '</strong></div>' +
        (requested ? '<div class="ma-info">Boleta solicitada · ' + method + '</div>' :
          '<label class="ma-method">Método de pago<select aria-label="Método de pago"><option value="">Selecciona</option>' +
            ['Transferencia', 'Efectivo', 'Tarjeta'].map(option => '<option' + (method === option ? ' selected' : '') + '>' + option + '</option>').join('') + '</select></label>') :
        '<div class="ma-info">La cuenta aparecerá después de tu primer pedido.</div>');
    return '<h2>¿Necesitas ayuda?</h2><div class="ma-info" aria-live="polite">' +
      (called ? 'Llamada al mesero pendiente.' : 'El personal recibirá una llamada de Mesa 4.') + '</div>' +
      '<div class="ma-actions">' + button('call', called ? 'Mesero avisado' : 'Llamar al mesero', 'ma-primary', called) +
      button('back', 'Volver') + '</div>';
  };
  function render() {
    for (const step of steps) step.setAttribute('aria-pressed', String(step.dataset.screen === current));
    for (const preview of previews) {
      const isMarket = preview.classList.contains('market');
      const isMinimal = preview.classList.contains('minimal');
      const subtotal = amount(quantities);
      const action = current === 'menu' ? button('cart', 'Ver carrito · ' + peso(subtotal), 'ma-primary', subtotal === 0) :
        current === 'cart' ? button('confirm', 'Confirmar · ' + peso(subtotal), 'ma-primary', subtotal === 0) :
        current === 'orders' ? button('bill', 'Ver cuenta', 'ma-primary', amount(ordered) === 0) :
        current === 'bill' && amount(ordered) && !requested ? button('request', 'Pedir boleta', 'ma-primary', !method) : '';
      preview.innerHTML =
        '<header class="ma-header"><strong>MenuApp</strong><span class="ma-mesa">Mesa 4</span><span class="ma-help">' +
        button('help', 'Ayuda') + '</span></header>' +
        (isMarket ? nav(false) : '') +
        '<div class="ma-body">' + body() + '</div>' +
        (action ? '<div class="ma-foot">' + (isMarket ? '' : '<span>' +
          (current === 'menu' || current === 'cart' ? quantities.reduce((a,b)=>a+b,0) + ' en carrito' : '') +
          '</span>') + action + '</div>' : '') +
        (!isMarket ? nav(isMinimal) : '');
    }
  }
  function choose(screen) {
    current = screen;
    render();
    window.openai?.setWidgetState?.({ modelContent: { pantalla: current } })?.catch(() => {});
  }
  root.addEventListener('click', event => {
    const target = event.target.closest('button');
    if (!target || target.disabled) return;
    if (target.dataset.screen) return choose(target.dataset.screen);
    const action = target.dataset.act;
    if (!action) return;
    if (action.startsWith('plus-') || action.startsWith('minus-')) {
      const [direction, index] = action.split('-');
      quantities[index] = Math.max(0, quantities[index] + (direction === 'plus' ? 1 : -1));
    } else if (action === 'help') {
      if (current !== 'help') previous = current;
      return choose('help');
    } else if (action === 'back') return choose(previous);
    else if (action === 'call') called = true;
    else if (action === 'confirm') {
      ordered = ordered.map((count, index) => count + quantities[index]);
      quantities = [0, 0, 0];
      return choose('orders');
    } else if (action === 'request' && method) requested = true;
    else if (Object.hasOwn(names, action)) return choose(action);
    render();
  });
  root.addEventListener('change', event => {
    if (event.target.matches('select')) {
      method = event.target.value;
      for (const preview of previews) {
        const select = preview.querySelector('select');
        const request = preview.querySelector('[data-act="request"]');
        if (select) select.value = method;
        if (request) request.disabled = !method;
      }
    }
  });
  function restore(state) {
    const screen = state?.modelContent?.pantalla;
    if (Object.hasOwn(names, screen)) { current = screen; render(); }
  }
  render();
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
  if (globalThis.Tweak) {
    for (const preview of previews) {
      const state = { radio: 20 };
      const tweak = new Tweak({ container: preview, onChange: () => preview.style.setProperty('--radius', state.radio + 'px') });
      tweak.addSlider(state, 'radio', { label: 'Redondeo', min: 4, max: 28, unit: 'px' });
    }
  }
})();
</script>
